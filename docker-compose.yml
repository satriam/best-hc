version: '3.8'

# ============================================================
# Best HCM — PostgreSQL DEVELOPMENT
# ============================================================
# File ini HANYA mengelola container development.
#
#   postgres      port 5432   PRODUCTION  -> database besthcm_prod
#   postgres_dev  port 5433   DEVELOPMENT -> database besthcm_dev (mirror production)
#
# Container `postgres` (produksi) dipakai bersama banyak project lain di mesin ini,
# jadi SENGAJA tidak dideklarasikan di sini — jangan sampai ter-recreate.
#
# Pakai:
#   docker compose up -d        # nyalakan postgres_dev
#   docker compose logs -f      # lihat log
# ============================================================

services:
  postgres_dev:
    image: postgres:16-alpine
    container_name: postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: besthcm_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

volumes:
  postgres_dev_data:
    external: true
    name: besthcm_dev_pgdata
